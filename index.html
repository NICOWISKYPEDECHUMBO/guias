    --desk:#23272e; --desk2:#1b1e24;
    --painel:#2c313a; --linha:#3a404b;
    --tinta:#eef1f5; --tinta2:#9aa3b1;
    --couro:#14161a; --couro2:#2a2e35; --metal:#c7cbd2; --metal2:#8b929c;
    --manila:#e7b23c; --manila2:#c9922a; --manilaEdge:#f6d174;
    --papel:#fbf7ee; --papelLinha:#d8cfbd;
    --c-lancado:#2f8f4e; --c-duplicado:#c98a1b; --c-ilegivel:#6b7280;
    --c-enviado_geap:#2b6cb0; --c-cancelado:#c0392b;
    --ok:#2f8f4e; --erro:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Inter,system-ui,Arial,sans-serif;color:var(--tinta);
    background:
      radial-gradient(1200px 600px at 80% -10%, #313742 0%, transparent 60%),
      radial-gradient(900px 500px at 0% 110%, #2a2f38 0%, transparent 55%),
      var(--desk);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.titulo{font-family:Archivo,sans-serif}
  button{font-family:inherit;cursor:pointer}
  input{font-family:inherit}
  .oculto{display:none !important}

  /* ---------- LOGIN ---------- */
  #tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .cartao-login{
    width:100%;max-width:380px;background:var(--painel);border:1px solid var(--linha);
    border-radius:16px;padding:30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.45)
  }
  .marca-topo{display:flex;justify-content:center;margin-bottom:10px}
  .logo-marca{width:230px;max-width:80%;height:78px;background:var(--logo) center/contain no-repeat}
  .titulo-sistema{font-size:20px;margin:0 0 22px;text-align:center;line-height:1.2;letter-spacing:.2px}
  .campo{margin-bottom:14px}
  .campo label{display:block;font-size:12px;color:var(--tinta2);margin-bottom:6px}
  .campo input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--linha);
    background:#1f232a;color:var(--tinta);font-size:15px;outline:none}
  .campo input:focus{border-color:#5b6bd6;box-shadow:0 0 0 3px rgba(91,107,214,.18)}
  .btn{border:none;border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px;background:#4457c9;color:#fff}
  .btn:hover{filter:brightness(1.08)}
  .btn.bloco{width:100%}
  .btn.secundario{background:#333a45;color:var(--tinta)}
  .btn.perigo{background:#402525;color:#f0b4b4}
  .link{background:none;border:none;color:#9db0ff;font-size:13px;padding:8px 0}
  .aviso{font-size:13px;min-height:18px;margin-top:4px}
  .aviso.erro{color:#f2a3a3}.aviso.ok{color:#9ee0b4}

  /* ---------- APP ---------- */
  #tela-app{min-height:100vh;display:flex;flex-direction:column}
  header.topo{position:sticky;top:0;z-index:20;background:rgba(23,26,31,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--linha);padding:12px 18px;display:flex;align-items:center;gap:14px}
  .crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;flex:1;min-width:0}
  .crumbs .c{color:#9db0ff;background:none;border:none;padding:4px 6px;border-radius:6px;font-size:14px;max-width:230px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumbs .c:hover{background:#2c323c}
  .crumbs .sep{color:var(--tinta2)}
  .crumbs .atual{color:var(--tinta);font-weight:600}
  .usuario{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tinta2)}
  main{padding:22px 18px 60px;max-width:1180px;width:100%;margin:0 auto;flex:1}
  .barra-acao{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .barra-acao h2{margin:0;font-size:19px}
  .barra-acao .spacer{flex:1}
  .grade{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .vazio{color:var(--tinta2);border:1px dashed var(--linha);border-radius:14px;padding:40px 20px;text-align:center}

  /* nome editavel */
  .nome-edit{outline:none;border-radius:6px;padding:2px 4px}
  .nome-edit:focus{background:rgba(255,255,255,.14);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .item.travado .nome-edit{pointer-events:none}

  /* menu de acoes */
  .item{position:relative}
  .acoes-btn{position:absolute;top:8px;right:8px;z-index:4;width:30px;height:30px;border-radius:8px;border:none;
    background:rgba(0,0,0,.35);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
  .acoes-btn:hover{background:rgba(0,0,0,.55)}
  .menu{position:absolute;top:42px;right:8px;z-index:9;background:#20242b;border:1px solid var(--linha);
    border-radius:10px;padding:6px;min-width:172px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
  .menu button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:none;color:var(--tinta);
    font-size:13.5px;padding:9px 10px;border-radius:7px;text-align:left}
  .menu button:hover{background:#2d333d}
  .menu button.del{color:#f2a3a3}
  .menu .div{height:1px;background:var(--linha);margin:5px 2px}

  /* contador / status */
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;
    background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  .chip.ok{background:rgba(47,143,78,.9)}
  .chip.fora{background:rgba(180,120,20,.9)}
  .cadeado{position:absolute;top:8px;left:8px;z-index:6;background:rgba(0,0,0,.5);color:#ffd772;border-radius:8px;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px}

  /* ---------- MALA (maleta de couro preta) ---------- */
  .mala{background:none;border:none;padding:0;width:100%;text-align:left}
  .mala .corpo{
    position:relative;border-radius:16px;padding:16px;min-height:150px;color:#fff;overflow:visible;
    border:1px solid #050506;
    background:
      radial-gradient(120% 80% at 30% 8%, #43474e 0%, #23262c 46%, #101215 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.08), inset 0 -18px 30px rgba(0,0,0,.5), 0 18px 34px rgba(0,0,0,.5);
  }
  .mala .corpo::before{ /* costura */
    content:"";position:absolute;inset:9px;border-radius:11px;border:2px dashed rgba(255,255,255,.14);pointer-events:none}
  .mala .corpo::after{ /* vinco tampa/base */
    content:"";position:absolute;left:10px;right:10px;top:58%;height:3px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(0,0,0,.85),transparent);box-shadow:0 1px 0 rgba(255,255,255,.05)}
  .mala .alca{position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:78px;height:20px;z-index:3;
    border:6px solid #0b0c0e;border-bottom:none;border-radius:16px 16px 0 0;background:linear-gradient(#33373d,#141619)}
  .mala .canto{position:absolute;width:26px;height:26px;z-index:3;background:radial-gradient(circle at 35% 30%,#3a3d42,#0a0b0d 70%)}
  .mala .canto.tl{top:0;left:0;border-radius:16px 0 46px 0}
  .mala .canto.tr{top:0;right:0;border-radius:0 16px 0 46px}
  .mala .canto.bl{bottom:0;left:0;border-radius:0 46px 0 16px}
  .mala .canto.br{bottom:0;right:0;border-radius:46px 0 16px 0}
  .mala .latch{position:absolute;top:56%;transform:translateY(-50%);z-index:3;width:38px;height:24px;border-radius:5px;
    background:linear-gradient(#f2f5f8,#a7adb6);border:1px solid #767c85;box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(0,0,0,.5);
    display:flex;gap:3px;align-items:center;justify-content:center}
  .mala .latch.e{left:20px}.mala .latch.d{right:20px}
  .mala .latch i{width:7px;height:13px;border-radius:2px;background:linear-gradient(#3c4147,#161a1e)}
  .placa{position:relative;z-index:4;margin:0 8px;background:linear-gradient(#3a3d43,#212327);
    color:#eef1f5;border-radius:8px;padding:9px 12px;min-height:50px;border:1px solid #0c0d10;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.4)}
  .placa .rot{font-size:10.5px;color:#9aa3b0;letter-spacing:.6px;text-transform:uppercase;margin-bottom:2px}
  .placa .nome-edit{font-family:Archivo;font-weight:700;font-size:16.5px;line-height:1.15;color:#f4f6f9;text-transform:capitalize}
  .mala .rodape{position:relative;z-index:4;display:flex;align-items:center;gap:8px;margin:12px 8px 0}

  /* ---------- PASTA (pasta amarela brilhante) ---------- */
  .pasta{background:none;border:none;padding:0;width:100%;text-align:left}
  .pasta .corpo{position:relative;min-height:182px;display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 0 12px;background:none}
  .pasta .folder-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;
    filter:drop-shadow(0 14px 20px rgba(0,0,0,.45))}
  .pasta .placa2{position:relative;z-index:2;margin:0 16px 6px;background:rgba(255,255,255,.86);
    border:1px solid #c79a1e;border-radius:9px;padding:8px 11px}
  .pasta .nome-edit{font-family:Archivo;font-weight:700;font-size:16px;color:#4a3708;line-height:1.15;text-transform:capitalize}
  .pasta .rot{font-size:10.5px;color:#7a5f16;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px}
  .pasta .rodape{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin:0 16px}

  /* ---------- GUIA (cartão Dedica Saúde) ---------- */
  .guia{background:none;border:none;padding:0;width:100%;text-align:left}
  .guia .corpo{position:relative;min-height:186px;border-radius:16px;padding:18px 15px 16px;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    background:linear-gradient(160deg,#ffffff 0%,#eef3fb 100%);
    box-shadow:0 0 0 3px #1b3f86, inset 0 0 0 2px #a9c6f2, 0 12px 26px rgba(0,0,0,.32)}
  .guia .corpo::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 60% at 100% 0%, rgba(27,63,134,.14), transparent 60%),
      radial-gradient(120% 60% at 0% 100%, rgba(178,32,42,.10), transparent 60%)}

  /* ---------- PLAQUINHA DE NOME (por cima, desenho livre) ---------- */
  .rotulo-topo{position:relative;z-index:3;margin:0 2px 10px;background:linear-gradient(#30353e,#22262d);

  .item:not(.travado) .carimbo{cursor:pointer}
  .item:not(.travado) .carimbo:hover{filter:brightness(.97)}

  /* ---------- MODAL ---------- */
  .fundo-modal{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:22px;
    width:100%;max-width:460px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
  .modal h3{margin:0 0 6px;font-size:18px}
  .modal p{color:var(--tinta2);font-size:14px;margin:0 0 16px}

  .modal .linha{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

  .modal-visor iframe,.modal-visor img{width:100%;height:70vh;border:none;border-radius:10px;background:#fff;object-fit:contain}
  .opcoes-carimbo{display:grid;gap:9px;grid-template-columns:1fr 1fr}
  .op-carimbo{border:2px solid;border-radius:10px;padding:11px;font-weight:700;font-family:Archivo;color:#fff;
    text-transform:uppercase;letter-spacing:.5px;font-size:13px}
  .spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;
    animation:gira .8s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes gira{to{transform:rotate(360deg)}}
  .prog{font-size:13px;color:var(--tinta2);margin-top:10px}

<div id="camada-modal"></div>
<input id="file-guia" type="file" accept="application/pdf,image/*" class="oculto">

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://fvwpgftwoqrxwcoxgjje.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CAvjAOYF8KONEXQfkb7pRA_0SD0GHxO';
const BUCKET = 'malas';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const CARIMBOS = {
  lancado:      {rotulo:'Lançado',      cor:'#2f8f4e'},
  duplicado:    {rotulo:'Duplicado',    cor:'#c98a1b'},
  ilegivel:     {rotulo:'Ilegível',     cor:'#6b7280'},
  enviado_geap: {rotulo:'Enviado GEAP', cor:'#2b6cb0'},
  cancelado:    {rotulo:'Cancelado',    cor:'#c0392b'},
  escaneado:    {rotulo:'Escaneado',    cor:'#6d4bb8'},
};
const MIN_GUIAS = 20, MAX_GUIAS = 50;

/* ================= ESTADO ================= */
const estado = {
  user:null,
  malas:[], pastas:[], guias:[],
  view:'mesa',          // mesa | mala | pasta
  malaAtual:null, pastaAtual:null,
  destrancadas:new Set()
};
let logado = false;

/* ================= ATALHOS ================= */
const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sha256(txt){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

/* ================= AUTENTICAÇÃO ================= */
let modoCriar = false;
$('btn-alternar').onclick = ()=>{
  modoCriar = !modoCriar;
  $('btn-entrar').textContent = modoCriar ? 'Criar conta' : 'Entrar';
  $('btn-alternar').textContent = modoCriar ? 'Já tenho conta. Entrar' : 'Não tem conta? Criar conta';
  avisoLogin('');
};
function avisoLogin(msg, ok){
  const a=$('aviso-login'); a.textContent=msg||''; a.className='aviso'+(msg?(ok?' ok':' erro'):'');
}
$('btn-entrar').onclick = entrar;
$('in-senha').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });

async function entrar(){
  const email=$('in-email').value.trim(), senha=$('in-senha').value;
  if(!email || !senha){ avisoLogin('Preencha e-mail e senha.'); return; }
  $('btn-entrar').disabled=true;
  try{
    if(modoCriar){
      const {data,error}=await sb.auth.signUp({email,password:senha});
      if(error) throw error;
      if(data.user && data.user.identities && data.user.identities.length===0){
        avisoLogin('Esse e-mail já tem conta. Faça login.'); modoCriar=false;
        $('btn-entrar').textContent='Entrar'; return;
      }
      avisoLogin('Conta criada. Se pedir, confirme pelo e-mail e entre.', true);
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:senha});
      if(error) throw error;
    }
  }catch(err){
    avisoLogin(traduzErro(err.message));
  }finally{ $('btn-entrar').disabled=false; }
}
function traduzErro(m){
  m=m||'';
  if(/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/already registered/i.test(m)) return 'Esse e-mail já tem conta.';
  if(/6 characters/i.test(m)) return 'A senha precisa de pelo menos 6 caracteres.';
  if(/confirm/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
  return m;
}
$('btn-sair').onclick = ()=> sb.auth.signOut();

sb.auth.onAuthStateChange((_ev,session)=>{
  if(session && session.user){
    estado.user = session.user;
    if(!logado){ logado=true; entrarNoApp(); }
  }else{
    logado=false; estado.user=null;
    $('tela-app').classList.add('oculto');
    $('tela-login').style.display='flex';
  }
});

async function entrarNoApp(){
  $('tela-login').style.display='none';
  $('tela-app').classList.remove('oculto');
  $('email-usuario').textContent = estado.user.email;
  await carregarTudo();
  irMesa();
}

/* ================= DADOS ================= */
async function carregarTudo(){
  const [m,p,g] = await Promise.all([
    sb.from('malas').select('*').order('created_at'),
    sb.from('mala_pastas').select('*').order('created_at'),
    sb.from('mala_guias').select('*').order('created_at'),
  ]);
  estado.malas = m.data||[]; estado.pastas = p.data||[]; estado.guias = g.data||[];
}
const pastasDaMala = id => estado.pastas.filter(p=>p.mala_id===id);
const guiasDaPasta = id => estado.guias.filter(g=>g.pasta_id===id);
const guiasDaMala  = id => estado.guias.filter(g=>g.mala_id===id);

/* ================= NAVEGAÇÃO ================= */
function irMesa(){ estado.view='mesa'; estado.malaAtual=null; estado.pastaAtual=null; render(); }
function abrirMala(id){
  const mala = estado.malas.find(m=>m.id===id); if(!mala) return;
  if(mala.bloqueada && !estado.destrancadas.has(id)){
    pedirSenhaAbrir(mala); return;
  }
  estado.malaAtual = mala; estado.view='mala'; estado.pastaAtual=null; render();
}
function abrirPasta(id){
  const pasta = estado.pastas.find(p=>p.id===id); if(!pasta) return;
  estado.pastaAtual = pasta; estado.view='pasta'; render();
}

/* ================= RENDER ================= */
function render(){ fecharMenus(); renderCrumbs(); renderConteudo(); }

function renderCrumbs(){
  const c=$('crumbs'); let h=`<button class="c" onclick="irMesa()">Mesa</button>`;
  if(estado.malaAtual){
    h+=`<span class="sep">/</span>`;
    if(estado.view==='mala') h+=`<span class="c atual">${esc(estado.malaAtual.nome)}</span>`;
    else h+=`<button class="c" onclick="abrirMala('${estado.malaAtual.id}')">${esc(estado.malaAtual.nome)}</button>`;
  }
  if(estado.pastaAtual){
    h+=`<span class="sep">/</span><span class="c atual">${esc(estado.pastaAtual.nome)}</span>`;
  }
  c.innerHTML=h;
}

function chipContagem(n){
  const dentro = n>=MIN_GUIAS && n<=MAX_GUIAS;
  return `<span class="chip ${dentro?'ok':'fora'}">${n}/${MAX_GUIAS} guias</span>`;
}
function carimbosHTML(lista, tipo, id, travada){
  if(!Array.isArray(lista) || !lista.length) return '';
  const pilulas = lista.map((c,i)=>{
    const d=CARIMBOS[c && c.t]; if(!d) return '';
    const rem = travada ? '' : `onclick="removerCarimbo(event,'${tipo}','${id}',${i})" title="Clique para remover"`;
    return `<span class="carimbo" style="--cor:${d.cor}" ${rem}>${esc(d.rotulo.toUpperCase())}</span>`;
  }).join('');
  return `<div class="area-carimbo">${pilulas}</div>`;
}
function botaoAcoes(tipo,id){
  return `<button class="acoes-btn" onclick="abrirMenu(event,'${tipo}','${id}')">⋯</button>`;
}

function renderConteudo(){
  const grade=$('grade');
  if(estado.view==='mesa'){
    $('titulo-view').textContent='Minhas malas';
    $('btn-novo').textContent='Nova mala';
    $('btn-novo').onclick=novaMala;
    if(!estado.malas.length){ grade.innerHTML=`<div class="vazio">Nenhuma mala ainda. Crie a primeira para começar a guardar suas guias.</div>`; return; }
    grade.innerHTML = estado.malas.map(m=>malaCard(m)).join('');
  }
  else if(estado.view==='mala'){
    const m=estado.malaAtual;
    $('titulo-view').textContent='Pastas da mala';
    $('btn-novo').textContent='Nova pasta';
    $('btn-novo').onclick=novaPasta;
    $('btn-novo').style.display = m.bloqueada ? 'none':'';
    const ps=pastasDaMala(m.id);
    let aviso='';
    if(m.bloqueada){
      aviso=`<div class="vazio" style="border-style:solid;color:var(--tinta)">
        Esta mala está trancada. Para alterar o conteúdo,
        <button class="link" onclick="destrancarMala('${m.id}')">destranque com a senha</button>.</div>`;
    }
    grade.innerHTML = aviso + (ps.length? ps.map(p=>pastaCard(p)).join('') :
      `<div class="vazio">Nenhuma pasta nesta mala. Crie uma pasta para organizar as guias.</div>`);
  }
  else if(estado.view==='pasta'){
    const p=estado.pastaAtual, m=estado.malaAtual;
    const travada = !!m.carimbo;
    $('titulo-view').textContent='Guias da pasta';
    $('btn-novo').textContent='Adicionar guia';
    $('btn-novo').onclick=adicionarGuia;
    $('btn-novo').style.display = travada ? 'none':'';
    const gs=guiasDaPasta(p.id);
    grade.innerHTML = gs.length? gs.map(g=>guiaCard(g)).join('') :
      `<div class="vazio">Nenhuma guia nesta pasta. Toque em “Adicionar guia” e envie o PDF ou a foto.</div>`;
  }
}

/* ----- desenhos (SVG) ----- */
const SVG_PASTA = `<svg class="folder-svg" viewBox="0 0 240 190" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <path d="M30 60 h64 l16 -16 h40 a10 10 0 0 1 10 10 v6 h44 a12 12 0 0 1 12 12 v78 a12 12 0 0 1 -12 12 H30 a12 12 0 0 1 -12 -12 V72 a12 12 0 0 1 12 -12 z"
        fill="#e3a417" stroke="#221809" stroke-width="6" stroke-linejoin="round"/>
  <rect x="54" y="46" width="150" height="86" rx="7" fill="#ffffff" stroke="#c7c0ae" stroke-width="3"/>
  <rect x="62" y="40" width="150" height="86" rx="7" fill="#fbfaf6" stroke="#c7c0ae" stroke-width="3"/>
  <path d="M18 176 V102 a14 14 0 0 1 14 -14 L150 72 a10 10 0 0 1 6 0 L208 84 a12 12 0 0 1 10 12 V176 a12 12 0 0 1 -12 12 H30 a12 12 0 0 1 -12 -12 z"
        fill="#f7bb1f" stroke="#221809" stroke-width="6" stroke-linejoin="round"/>
  <path d="M34 158 V108 a8 8 0 0 1 8 -8 L122 92" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
</svg>`;
const SVG_CADUCEU = `<svg class="caduceu" viewBox="0 0 60 92" width="34" height="52" aria-hidden="true">
  <line x1="30" y1="14" x2="30" y2="84" stroke="#0f6b3f" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="30" cy="11" r="6.5" fill="#12844f"/>
  <path d="M30 22 C 47 27, 13 35, 30 43 C 47 51, 13 59, 30 67 C 45 73, 22 79, 30 84"
        fill="none" stroke="#1a9a5e" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M30 22 q 9 -1 12 -6" fill="none" stroke="#1a9a5e" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="43.5" cy="15.5" r="1.6" fill="#0f6b3f"/>
</svg>`;

/* ----- cards ----- */
function malaCard(m){
  const n = guiasDaMala(m.id).length;
  const trav = !!m.bloqueada;
  return `<div class="item mala ${trav?'travado':''}">
    ${botaoAcoes('mala',m.id)}
    <div class="rotulo-topo" onclick="event.stopPropagation()">
      <div class="rot">Mala</div>
      <div class="nome-edit" contenteditable="${trav?'false':'true'}"
           onblur="salvarNome('mala','${m.id}',this)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(m.nome)}</div>
    </div>
    <div class="corpo" onclick="abrirMala('${m.id}')" style="cursor:pointer">
      <span class="alca"></span>
      <span class="canto tl"></span><span class="canto tr"></span><span class="canto bl"></span><span class="canto br"></span>
      <span class="latch e"><i></i><i></i><i></i></span>
      <span class="latch d"><i></i><i></i><i></i></span>
      ${m.bloqueada?`<span class="cadeado" title="Trancada">🔒</span>`:''}
    </div>
    <div class="contador">${chipContagem(n)}</div>
    ${carimbosHTML(m.carimbos, 'mala', m.id, trav)}
  </div>`;
}
function pastaCard(p){
  const n = guiasDaPasta(p.id).length;
  const trav = !!estado.malaAtual.bloqueada;
  return `<div class="item pasta ${trav?'travado':''}">
    ${trav?'':botaoAcoes('pasta',p.id)}
    <div class="rotulo-topo" onclick="event.stopPropagation()">
      <div class="rot">Pasta</div>
      <div class="nome-edit" contenteditable="${trav?'false':'true'}"
           onblur="salvarNome('pasta','${p.id}',this)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(p.nome)}</div>
    </div>
    <div class="corpo" onclick="abrirPasta('${p.id}')" style="cursor:pointer">
      ${SVG_PASTA}
    </div>
    <div class="contador"><span class="chip">${n} guia${n===1?'':'s'}</span></div>
    ${carimbosHTML(p.carimbos, 'pasta', p.id, trav)}
  </div>`;
}
function guiaCard(g){
  const trav = !!estado.malaAtual.bloqueada;
  const data = g.created_at? new Date(g.created_at).toLocaleDateString('pt-BR'):'';
  return `<div class="item guia ${trav?'travado':''}">
    <div class="corpo" onclick="verGuia('${g.id}')" style="cursor:pointer">
      <div class="guia-logo" role="img" aria-label="Dedica Saúde"></div>
      ${trav?'':botaoAcoes('guia',g.id)}
      <div class="nome-edit" contenteditable="${trav?'false':'true'}"
           onclick="event.stopPropagation()"
           onblur="salvarNome('guia','${g.id}',this)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(g.nome)}</div>
      <div class="meta">Guia SIASS · ${data}${g.meta&&g.meta.codigo?' · '+esc(g.meta.codigo):''}</div>
      ${carimbosHTML(g.carimbos, 'guia', g.id, trav)}
    </div>
  </div>`;
}

/* ================= NOME (editar inline) ================= */
async function salvarNome(tipo,id,elemento){
  const texto = elemento.textContent.trim();
  const tabela = tipo==='mala'?'malas':tipo==='pasta'?'mala_pastas':'mala_guias';
  const lista  = tipo==='mala'?estado.malas:tipo==='pasta'?estado.pastas:estado.guias;
  const obj = lista.find(x=>x.id===id); if(!obj) return;
  const novo = texto || obj.nome;
  if(novo===obj.nome){ elemento.textContent=obj.nome; return; }
  const {error} = await sb.from(tabela).update({nome:novo}).eq('id',id);
  if(error){ toast('Não deu para renomear: '+error.message,true); elemento.textContent=obj.nome; return; }
  obj.nome=novo; if(tipo!=='guia') renderCrumbs();
}

/* ================= CRIAR ================= */
async function novaMala(){
  const nome = await pedirTexto('Nova mala','Nome da mala (você pode renomear depois):','Mala');
  if(nome===null) return;
  const {data,error} = await sb.from('malas').insert({nome:nome||'Mala'}).select().single();
  if(error) return toast('Erro ao criar mala: '+error.message,true);
  estado.malas.push(data); render();
}
async function novaPasta(){
  const nome = await pedirTexto('Nova pasta','Nome da pasta:','Pasta');
  if(nome===null) return;
  const {data,error} = await sb.from('mala_pastas').insert({nome:nome||'Pasta',mala_id:estado.malaAtual.id}).select().single();
  if(error) return toast('Erro ao criar pasta: '+error.message,true);
  estado.pastas.push(data); render();
}

/* ================= ADICIONAR GUIA (upload + OCR) ================= */
function adicionarGuia(){ $('file-guia').value=''; $('file-guia').click(); }
$('file-guia').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file) return;
  const fechar = modalCarregando('Lendo a guia…','Reconhecendo o nome do servidor no documento.');
  let resultado={nome:'',meta:{}};
  try{ resultado = await lerGuiaOCR(file, msg=>fechar.progresso(msg)); }
  catch(err){ console.warn(err); }
  fechar();
  const nome = await pedirTexto('Confirmar guia','Confira o nome lido (ajuste se precisar):',
                 resultado.nome || '', 'Nome do servidor');
  if(nome===null) return;
  const fechar2 = modalCarregando('Guardando…','Enviando o arquivo com segurança.');
  try{
    const uid = estado.user.id;
    const gid = crypto.randomUUID();
    const ext = (file.name.split('.').pop()||'bin').toLowerCase();
    const path = `${uid}/${estado.malaAtual.id}/${estado.pastaAtual.id}/${gid}/arquivo.${ext}`;
    const up = await sb.storage.from(BUCKET).upload(path, file, {contentType:file.type, upsert:false});
    if(up.error) throw up.error;
    const {data,error} = await sb.from('mala_guias').insert({
      id:gid, mala_id:estado.malaAtual.id, pasta_id:estado.pastaAtual.id,
      nome: nome||'Guia', arquivo_path:path, meta: resultado.meta||{}
    }).select().single();
    if(error) throw error;
    estado.guias.push(data);
    fechar2(); render();
  }catch(err){ fechar2(); toast('Não deu para guardar: '+err.message,true); }
});

/* ---- OCR ---- */
let libsProntas=false;
function carregarScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Falha ao carregar biblioteca'));document.head.appendChild(s);});}
async function garantirLibs(){
  if(libsProntas) return;
  await carregarScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
  await carregarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  libsProntas=true;
}
async function lerGuiaOCR(file, prog){
  await garantirLibs();
  if(file.type==='application/pdf'){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    const page = await pdf.getPage(1);
    const tc = await page.getTextContent();
    let texto = tc.items.map(i=>i.str).join(' ');
    if(texto.replace(/\s/g,'').length>60){
      const nome=extrairNome(texto); if(nome) return {nome, meta:extrairMeta(texto)};
    }
    prog && prog('Documento escaneado, lendo por imagem…');
    const vp = page.getViewport({scale:2.2});
    const cv = document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    const t = await ocrImagem(cv, prog);
    return {nome: extrairNome(t)||'', meta: extrairMeta(t)};
  }else{
    const t = await ocrImagem(file, prog);
    return {nome: extrairNome(t)||'', meta: extrairMeta(t)};
  }
}
async function ocrImagem(fonte, prog){
  const worker = await Tesseract.createWorker('por', 1, { logger:m=>{
    if(m.status==='recognizing text' && prog) prog('Lendo… '+Math.round((m.progress||0)*100)+'%');
  }});
  const {data:{text}} = await worker.recognize(fonte);
  await worker.terminate();
  return text||'';
}
function limpar(s){ return s.replace(/[ \t]+/g,' ').replace(/\r/g,''); }
function tituloCaso(s){
  return s.toLowerCase().replace(/\b([a-záàâãéêíóôõúç])/g,(m,c)=>c.toUpperCase())
          .replace(/\b(De|Da|Do|Das|Dos|E)\b/g,x=>x.toLowerCase());
}
function extrairNome(texto){
  const t=limpar(texto);
  let m = t.match(/Dados do Servidor[\s\S]{0,80}?Nome[\s:.]*([A-ZÁÀÂÃÉÊÍÓÔÕÚÇ][A-ZÁÀÂÃÉÊÍÓÔÕÚÇ' ]{5,60}?)\s+Sexo/i);
  if(!m) m = t.match(/Nome[\s:.]*([A-ZÁÀÂÃÉÊÍÓÔÕÚÇ][A-ZÁÀÂÃÉÊÍÓÔÕÚÇ' ]{5,60}?)\s+Sexo/i);
  if(!m){
    const linhas=t.split(/\n|(?<=[a-z])\s{2,}/);
    for(const l of linhas){
      const c=l.trim();
      if(/^[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ' ]{8,60}$/.test(c) && c.split(' ').filter(Boolean).length>=2
         && !/MINISTERIO|RELACOES|EXTERIORES|SERVIDOR|EXAMES|SIASS|ORGAO|JANEIRO/.test(c)){
        return tituloCaso(c.trim());
      }
    }
    return '';
  }
  return tituloCaso(m[1].trim());
}
function extrairMeta(texto){
  const t=limpar(texto); const meta={};
  const cod = t.match(/\b([0-9A-Z]{4}(?:\.[0-9A-Z]{4}){3,6})\b/);
  if(cod) meta.codigo = cod[1];
  return meta;
}

/* ================= VER GUIA ================= */
async function verGuia(id){
  const g = estado.guias.find(x=>x.id===id); if(!g||!g.arquivo_path) return;
  const {data,error} = await sb.storage.from(BUCKET).createSignedUrl(g.arquivo_path, 180);
  if(error) return toast('Não deu para abrir: '+error.message,true);
  const url = data.signedUrl;
  const ehImg = /\.(png|jpe?g|webp)$/i.test(g.arquivo_path);
  abrirModal(`
    <div class="modal modal-visor">
      <h3 style="margin-bottom:12px">${esc(g.nome)}</h3>
      ${ehImg?`<img src="${url}">`:`<iframe src="${url}"></iframe>`}
      <div class="linha">
        <a class="btn secundario" href="${url}" target="_blank" rel="noopener">Abrir em nova aba</a>
        <button class="btn" onclick="fecharModal()">Fechar</button>
      </div>
    </div>`);
}

/* ================= MENU DE AÇÕES ================= */
function fecharMenus(){ document.querySelectorAll('.menu').forEach(m=>m.remove()); }
document.addEventListener('click', e=>{ if(!e.target.closest('.menu') && !e.target.closest('.acoes-btn')) fecharMenus(); });

function abrirMenu(ev,tipo,id){
  ev.stopPropagation(); fecharMenus();
  const alvo = ev.currentTarget.closest('.item');
  const menu = document.createElement('div'); menu.className='menu';
  let itens='';
  if(tipo==='mala'){
    const mala=estado.malas.find(m=>m.id===id);
    if(mala && mala.bloqueada){
      itens = `<button onclick="destrancarMala('${id}')">Destrancar</button>`;
    }else{
      itens  = `<button onclick="acaoCarimbar('mala','${id}')">Carimbar</button>`;
      itens += `<button onclick="acaoRenomear('mala','${id}')">Renomear</button>`;
      itens += `<button onclick="trancarMala('${id}')">Trancar (20 a 50, com senha)</button>`;
      itens += `<div class="div"></div><button class="del" onclick="acaoExcluir('mala','${id}')">Excluir</button>`;
    }
  }else{
    itens  = `<button onclick="acaoCarimbar('${tipo}','${id}')">Carimbar</button>`;
    itens += `<button onclick="acaoRenomear('${tipo}','${id}')">Renomear</button>`;
    itens += `<div class="div"></div><button class="del" onclick="acaoExcluir('${tipo}','${id}')">Excluir</button>`;
  }
  menu.innerHTML=itens; alvo.appendChild(menu);
}

/* ----- carimbar (acumula, um não cobre o outro) ----- */
function refs(tipo){
  return { tabela: tipo==='mala'?'malas':tipo==='pasta'?'mala_pastas':'mala_guias',
           lista:  tipo==='mala'?estado.malas:tipo==='pasta'?estado.pastas:estado.guias };
}
async function acaoCarimbar(tipo,id){
  fecharMenus();
  const {tabela,lista}=refs(tipo);
  const obj=lista.find(x=>x.id===id); if(!obj) return;
  if(tipo==='mala' && obj.bloqueada) return toast('Mala trancada. Destranque para carimbar.',true);
  const cod = await escolherCarimbo();
  if(!cod) return;
  const novos = [...(Array.isArray(obj.carimbos)?obj.carimbos:[]), {t:cod, em:new Date().toISOString()}];
  const {error}=await sb.from(tabela).update({carimbos:novos}).eq('id',id);
  if(error) return toast('Erro ao carimbar: '+error.message,true);
  obj.carimbos=novos; render();
}
async function removerCarimbo(ev,tipo,id,idx){
  ev.stopPropagation();
  const {tabela,lista}=refs(tipo);
  const obj=lista.find(x=>x.id===id); if(!obj) return;
  if(tipo==='mala' && obj.bloqueada) return;
  const ok=await pedirConfirma('Remover carimbo','Tirar este carimbo do item?'); if(!ok) return;
  const novos=(obj.carimbos||[]).filter((_,i)=>i!==idx);
  const {error}=await sb.from(tabela).update({carimbos:novos}).eq('id',id);
  if(error) return toast('Erro: '+error.message,true);
  obj.carimbos=novos; render();
}

/* ----- trancar/destrancar mala (20 a 50 + senha) ----- */
async function trancarMala(id){
  fecharMenus();
  const n=guiasDaMala(id).length;
  if(n<MIN_GUIAS || n>MAX_GUIAS) return toast(`A mala precisa ter de ${MIN_GUIAS} a ${MAX_GUIAS} guias para trancar. Tem ${n}.`,true);
  const mala=estado.malas.find(m=>m.id===id);
  const senha=await pedirTexto('Trancar a mala','Crie uma senha. A mala fica trancada e só abre com ela.','', 'Senha da mala','password');
  if(senha===null) return;
  if(senha.length<3) return toast('Use uma senha com pelo menos 3 caracteres.',true);
  const hash=await sha256(senha);
  const {error}=await sb.from('malas').update({bloqueada:true, senha_hash:hash}).eq('id',id);
  if(error) return toast('Erro ao trancar: '+error.message,true);
  Object.assign(mala,{bloqueada:true, senha_hash:hash}); estado.destrancadas.delete(id); render();
}
async function pedirSenhaAbrir(mala){
  const s=await pedirTexto('Mala trancada',`A mala "${mala.nome}" está trancada. Digite a senha para abrir.`,'', 'Senha','password');
  if(s===null) return;
  const hash=await sha256(s);
  if(hash!==mala.senha_hash) return toast('Senha incorreta.',true);
  estado.destrancadas.add(mala.id);
  estado.malaAtual=mala; estado.view='mala'; estado.pastaAtual=null; render();
}
async function destrancarMala(id){
  fecharMenus();
  const mala=estado.malas.find(m=>m.id===id);
  const s=await pedirTexto('Destrancar mala','Digite a senha para liberar a edição.','', 'Senha','password');
  if(s===null) return;
  const hash=await sha256(s);
  if(hash!==mala.senha_hash) return toast('Senha incorreta.',true);
  const {error}=await sb.from('malas').update({bloqueada:false, senha_hash:null}).eq('id',id);
  if(error) return toast('Erro: '+error.message,true);
  Object.assign(mala,{bloqueada:false, senha_hash:null}); estado.destrancadas.delete(id); render();
}

/* ----- renomear (via modal) ----- */
async function acaoRenomear(tipo,id){
  fecharMenus();
  const lista = tipo==='mala'?estado.malas:tipo==='pasta'?estado.pastas:estado.guias;
  const tabela= tipo==='mala'?'malas':tipo==='pasta'?'mala_pastas':'mala_guias';
  const obj=lista.find(x=>x.id===id);
  const novo = await pedirTexto('Renomear','Novo nome:',obj.nome);
  if(novo===null||!novo.trim()) return;
  const {error}=await sb.from(tabela).update({nome:novo.trim()}).eq('id',id);
  if(error) return toast('Erro: '+error.message,true);
  obj.nome=novo.trim(); if(tipo!=='guia') renderCrumbs(); render();
}

/* ----- excluir ----- */
async function acaoExcluir(tipo,id){
  fecharMenus();
  const nomes={mala:'a mala (e tudo dentro dela)',pasta:'a pasta (e as guias dentro)',guia:'a guia'};
  const ok = await pedirConfirma('Excluir', `Tem certeza que quer excluir ${nomes[tipo]}? Não dá para desfazer.`);
  if(!ok) return;
  const tabela= tipo==='mala'?'malas':tipo==='pasta'?'mala_pastas':'mala_guias';
  if(tipo==='guia'){
    const g=estado.guias.find(x=>x.id===id);
    if(g&&g.arquivo_path){ await sb.storage.from(BUCKET).remove([g.arquivo_path]); }
  }
  const {error}=await sb.from(tabela).delete().eq('id',id);
  if(error) return toast('Erro ao excluir: '+error.message,true);
  await carregarTudo();
  if(tipo==='mala' && estado.malaAtual && estado.malaAtual.id===id) irMesa();
  else if(tipo==='pasta' && estado.pastaAtual && estado.pastaAtual.id===id){ estado.view='mala'; estado.pastaAtual=null; render(); }
  else render();
}

/* ================= MODAIS ================= */
function abrirModal(html){ $('camada-modal').innerHTML=`<div class="fundo-modal">${html}</div>`; }
function fecharModal(){ $('camada-modal').innerHTML=''; }
function pedirTexto(titulo,texto,valor,placeholder,tipo){
  return new Promise(res=>{
    abrirModal(`<div class="modal">
      <h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      <input id="mp-in" type="${tipo||'text'}" value="${esc(valor||'')}" placeholder="${esc(placeholder||'')}">
      <div class="linha">
        <button class="btn secundario" id="mp-cancel">Cancelar</button>
        <button class="btn" id="mp-ok">Salvar</button>
      </div></div>`);
    const inp=$('mp-in'); inp.focus(); inp.select();
    $('mp-ok').onclick=()=>{const v=inp.value;fecharModal();res(v);};
    $('mp-cancel').onclick=()=>{fecharModal();res(null);};
    inp.onkeydown=e=>{ if(e.key==='Enter'){const v=inp.value;fecharModal();res(v);} if(e.key==='Escape'){fecharModal();res(null);} };
  });
}
function pedirConfirma(titulo,texto){
  return new Promise(res=>{
    abrirModal(`<div class="modal">
      <h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      <div class="linha">
        <button class="btn secundario" id="mc-nao">Cancelar</button>
        <button class="btn perigo" id="mc-sim">Excluir</button>
      </div></div>`);
    $('mc-sim').onclick=()=>{fecharModal();res(true);};
    $('mc-nao').onclick=()=>{fecharModal();res(false);};
  });
}
function escolherCarimbo(){
  return new Promise(res=>{
    const ops=Object.entries(CARIMBOS).map(([k,v])=>
      `<button class="op-carimbo" style="border-color:${v.cor};background:${v.cor}22;color:${v.cor}"
        onclick="window.__escolha('${k}')">${esc(v.rotulo)}</button>`).join('');
    abrirModal(`<div class="modal">
      <h3>Carimbar</h3>
      <p>Escolha o carimbo. Ele soma aos que já estão no item.</p>
      <div class="opcoes-carimbo">${ops}</div>
      <div class="linha">
        <button class="btn secundario" onclick="window.__escolha(undefined)">Cancelar</button>
      </div></div>`);
    window.__escolha=(v)=>{ fecharModal(); delete window.__escolha; res(v); };
  });
}
function modalCarregando(titulo,texto){
  abrirModal(`<div class="modal"><h3>${esc(titulo)}</h3>
    <p>${esc(texto)}</p><div><span class="spinner"></span> <span id="mc-prog" class="prog">Processando…</span></div></div>`);
  const f=()=>fecharModal();
  f.progresso=(m)=>{ const e=$('mc-prog'); if(e) e.textContent=m; };
  return f;
}
function toast(msg,erro){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText=`position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
    background:${erro?'#3a2222':'#213a26'};color:${erro?'#f2b8b8':'#bde8c9'};
    border:1px solid ${erro?'#663333':'#2b4a35'};padding:12px 18px;border-radius:12px;font-size:14px;
    max-width:90vw;box-shadow:0 12px 30px rgba(0,0,0,.5)`;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';},2600);
  setTimeout(()=>d.remove(),3100);
}
